<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlog - 일정 상세 및 가져오기</title>
    <link rel="stylesheet" href="https://googleapis.com">
    <style>
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --primary-text: #111111;
            --secondary-text: #666666;
            --muted-text: #999999;
            --accent-color: #FF5A5F; /* 원더로그 시그니처 다홍색 */
            --blue-point: #3B82F6;
            --orange-point: #F97316;
            --border-color: #EAEAEA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
            letter-spacing: -0.03em;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
        }

        /* GNB 헤더 영역 */
        header {
            width: 100%;
            height: 70px;
            background-color: #FFFFFF;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4%;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent-color);
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 14px;
            color: var(--secondary-text);
        }

        /* 메인 스케줄러 레이아웃 */
        .main-container {
            max-width: 1100px;
            margin: 40px auto;
            background-color: #FFFFFF;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            min-height: 700px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        /* 왼쪽 DAY 사이드바 */
        .sidebar {
            width: 180px;
            border-right: 1px solid var(--border-color);
            background-color: #FDFDFD;
            padding: 24px 0;
        }

        .day-tab {
            padding: 16px 28px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-tab.active {
            background-color: #FFF5F5;
            border-left: 4px solid var(--accent-color);
        }

        .day-tab .day-num {
            font-size: 15px;
            font-weight: 700;
            color: var(--muted-text);
        }

        .day-tab.active .day-num {
            color: var(--accent-color);
        }

        .day-tab .day-date {
            font-size: 12px;
            color: var(--muted-text);
            margin-top: 2px;
        }

        /* 오른쪽 컨텐츠 영역 */
        .content-area {
            flex: 1;
            padding: 40px;
        }

        /* 컨텐츠 상단 헤더 */
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #F5F5F5;
        }

        .current-day-info {
            display: flex;
            align-items: baseline;
            gap: 12px;
        }

        .current-day-title {
            font-size: 24px;
            font-weight: 700;
        }

        .current-day-date {
            font-size: 15px;
            color: var(--secondary-text);
        }

        /* 전체 일정 가져오기 상단 버튼 */
        .btn-import-all {
            background-color: var(--accent-color);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-import-all:hover {
            background-color: #E04F54;
        }

        /* 타임라인 카드 리스트 */
        .timeline-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .timeline-card {
            display: flex;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .timeline-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.04);
        }

        /* 카드 왼쪽 컬러 바 선 */
        .card-indicator {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 5px;
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
        }
        .card-indicator.blue { background-color: var(--blue-point); }
        .card-indicator.orange { background-color: var(--orange-point); }

        /* 시간 정보 */
        .time-info {
            width: 110px;
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-text);
            padding-top: 2px;
        }

        /* 장소 상세 내용 */
        .place-info {
            flex: 1;
        }

        .place-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .place-title {
            font-size: 18px;
            font-weight: 700;
        }

        /* 세련되게 다듬은 태그 배지 */
        .place-tag {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .place-tag.blue { background-color: #EFF6FF; color: var(--blue-point); }
        .place-tag.orange { background-color: #FFF7ED; color: var(--orange-point); }

        .place-address {
            font-size: 13px;
            color: var(--muted-text);
            margin-bottom: 10px;
        }

        .place-desc {
            font-size: 14px;
            color: var(--secondary-text);
            line-height: 1.6;
        }

        /* 우측 더보기/드래그 핸들 아이콘 영역 */
        .card-action {
            display: flex;
            align-items: center;
            color: #CCCCCC;
            cursor: grab;
            font-size: 18px;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <!-- 상단 GNB -->
    <header>
        <div class="logo">wanderlog</div>
        <div class="header-right">
            <span>공지사항</span>
            <div style="width: 32px; height: 32px; background-color: #EAEAEA; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 12px;">R</div>
        </div>
    </header>

    <!-- 메인 레이아웃 -->
    <div class="main-container">
        <!-- 왼쪽 DAY 탭 사이드바 -->
        <aside class="sidebar">
            <div class="day-tab">
                <div class="day-num">DAY 1</div>
                <div class="day-date">7/20(토)</div>
            </div>
            <div class="day-tab active">
                <div class="day-num">DAY 2</div>
                <div class="day-date">7/21(일)</div>
            </div>
            <div class="day-tab">
                <div class="day-num">DAY 3</div>
                <div class="day-date">7/22(월)</div>
            </div>
            <div class="day-tab">
                <div class="day-num">DAY 4</div>
                <div class="day-date">7/23(화)</div>
            </div>
        </aside>

        <!-- 오른쪽 상세 타임라인 정보 -->
        <main class="content-area">
            <div class="content-header">
                <div class="current-day-info">
                    <span class="current-day-title">DAY 2</span>
                    <span class="current-day-date">7월 21일 (일)</span>
                </div>
                <button class="btn-import-all">전체 일정 가져오기</button>
            </div>

            <!-- 불필요한 라인과 빈 박스를 제거하고 정갈하게 배치한 카드 리스트 -->
            <div class="timeline-list">
                
                <!-- 카드 1: 해운대해수욕장 -->
                <div class="timeline-card">
                    <div class="card-indicator blue"></div>
                    <div class="time-info">10:00 ~ 12:00</div>
                    <div class="place-info">
                        <div class="place-title-row">
                            <span class="place-title">해운대해수욕장</span>
                            <span class="place-tag blue">관광지</span>
                        </div>
                        <div class="place-address">부산 해운대구 해운대해변로 264</div>
                        <div class="place-desc">부산을 대표하는 해변으로 산책과 바다 구경을 즐길 수 있는 명소입니다.</div>
                    </div>
                    <div class="card-action">⋮⋮</div>
                </div>

                <!-- 카드 2: 해운대암소갈비집 -->
                <div class="timeline-card">
                    <div class="card-indicator orange"></div>
                    <div class="time-info">12:30 ~ 14:00</div>
                    <div class="place-info">
                        <div class="place-title-row">
                            <span class="place-title">해운대암소갈비집</span>
                            <span class="place-tag orange">음식점</span>
                        </div>
                        <div class="place-address">부산 해운대구 중동1로 24</div>
                        <div class="place-desc">30년 전통의 암소갈비 전문점으로 부드럽고 풍미 깊은 갈비를 맛볼 수 있습니다.</div>
                    </div>
                    <div class="card-action">⋮⋮</div>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
